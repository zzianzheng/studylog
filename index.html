<style>
:root{--bg:#f7f8fa;--panel:#fff;--line:#e8ebf0;--text:#202938;--muted:#7d8797;--blue:#748eaf;--shadow:0 8px 28px #26334a0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(500px,1fr) 300px;max-width:1700px;margin:auto;background:var(--panel);box-shadow:var(--shadow)}aside{padding:24px 16px;border-right:1px solid var(--line)}.brand{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center;margin:4px 8px 30px}.logo{width:30px;height:30px;border:2px solid var(--blue);border-radius:8px;display:grid;place-items:center;color:var(--blue)}.nav{display:grid;gap:5px}.nav button,.subject{border:0;background:transparent;color:#637087;padding:10px 12px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#eef0f2;color:var(--blue)}.ico{width:18px;text-align:center;font-size:17px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin:28px 8px 12px;font-weight:650}.addsubject{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}.subject{padding:9px 10px;width:100%;border:1px solid transparent;transition:background .15s,border-color .15s}.subject:hover{border-color:var(--subject-color);background:var(--subject-tint)!important}.subject .subject-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subject .dot{box-shadow:0 0 0 3px var(--subject-tint)}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex-shrink:0}.main{padding:24px 22px 30px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.monthnav{display:flex;align-items:center;gap:15px}.monthnav h1{font-size:25px;letter-spacing:-.7px;margin:0;font-weight:650}.plain{border:0;background:transparent;font-size:24px;color:#657187;cursor:pointer;padding:2px 5px}.controls{display:flex;gap:8px;align-items:center}.search{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:180px;outline:none}.viewtoggle{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px}.viewtoggle button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:#687386;cursor:pointer}.viewtoggle button.active{background:#eef0f2;color:var(--blue)}.calendar{border:1px solid var(--line);border-radius:12px;overflow:hidden}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{text-align:center;color:var(--muted);font-size:12px;padding:12px 2px;border-bottom:1px solid var(--line)}.days{grid-auto-rows:minmax(112px,auto)}.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;position:relative;padding:9px 7px 7px}.day:nth-child(7n){border-right:0}.daynum{font-size:12px;color:#596579;margin:0 0 7px 2px}.day.outside .daynum{color:#b4bbc6}.day.today{background:#f9fbff}.day.today .daynum{background:var(--blue);color:white;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;margin-top:-4px;margin-bottom:3px}.barstack{display:flex;flex-direction:column;gap:5px}.taskbar{height:25px;display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;cursor:pointer;font-size:11px;font-weight:550;text-align:left;min-width:0}.taskbar.start{border-radius:6px 0 0 6px;margin-right:-7px}.taskbar.middle{border-radius:0;margin-left:-7px;margin-right:-7px}.taskbar.end{border-radius:0 6px 6px 0;margin-left:-7px}.taskbar.single{border-radius:6px}.taskbar .barname{overflow:hidden;text-overflow:ellipsis}.taskbar .duedate{margin-left:auto;opacity:.75;font-size:10px;padding-left:5px}.taskbar.done{text-decoration:line-through;opacity:.48}.right{padding:24px 17px;border-left:1px solid var(--line);background:#fcfcfd}.right h2{font-size:16px;margin:2px 0 15px}.righthead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:18px}.righthead span{color:var(--muted);font-size:12px}.section{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.section-title{font-size:13px;font-weight:650;margin-bottom:12px;display:flex;justify-content:space-between}.taskrow{display:flex;align-items:flex-start;gap:9px;margin:11px 0}.taskrow input{margin-top:3px;accent-color:var(--blue)}.taskname{font-size:12px}.meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:4px}.upcoming{display:grid;gap:13px}.upitem{display:flex;gap:9px;align-items:flex-start;cursor:pointer}.upitem .name{font-size:12px}.upitem .date{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}.detail{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0}.detailtop{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:12px}.detaildates{color:var(--muted);font-size:11px;margin:12px 0}.subtasks{display:grid;gap:9px}.subtasks label{font-size:11px;display:flex;gap:7px;align-items:center}.primary{border:0;background:#eef0f2;color:var(--blue);padding:11px 14px;border-radius:9px;width:100%;cursor:pointer;font-weight:600}.mutebtn{border:1px solid var(--line);background:#fff;color:#536074;padding:9px 12px;border-radius:8px;cursor:pointer}.empty{padding:24px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#17203355;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:white;border-radius:16px;padding:24px;width:min(460px,100%);box-shadow:0 20px 70px #0002}.modal h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#596579}.field input,.field select{border:1px solid #d8dee8;border-radius:8px;padding:10px;font:inherit;width:100%;background:#fff;color:#202938;color-scheme:light;min-width:0;opacity:1}.field input[type="date"]{display:block;min-height:42px;color:#202938;-webkit-text-fill-color:#202938;accent-color:var(--blue)}.field input[type="date"]::-webkit-datetime-edit{color:#202938}.field input[type="date"]::-webkit-calendar-picker-indicator{opacity:.8;cursor:pointer}.field input::placeholder{color:#8a94a5;opacity:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.colors{display:flex;gap:8px;flex-wrap:wrap}.colorpick{width:24px;height:24px;border-radius:50%;border:2px solid white;outline:1px solid #d9dee7;cursor:pointer}.colorpick.selected{outline:2px solid #505b69;transform:scale(1.08)}.palette{display:flex;gap:9px;flex-wrap:wrap;padding:3px 1px}.colorpick{width:27px;height:27px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d6d9dc;cursor:pointer}.dangerbtn{border:1px solid #e7c9c7;background:#fff8f7;color:#a45c57;padding:9px 12px;border-radius:8px;cursor:pointer}.detailactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202938;color:white;padding:10px 16px;border-radius:9px;display:none;z-index:20}.mobileadd{display:none}
@media(max-width:1100px){.app{grid-template-columns:175px minmax(400px,1fr)}.right{display:none}.search{width:130px}}@media(max-width:700px){.app{display:block}.app>aside{display:none}.main{padding:18px 10px}.top{align-items:flex-start;flex-direction:column}.monthnav h1{font-size:22px}.controls{width:100%;flex-wrap:wrap}.search{flex:1}.days{grid-auto-rows:minmax(90px,auto)}.day{padding:6px 3px}.taskbar{font-size:9px;padding:0 4px;height:22px}.taskbar .duedate{display:none}.weekdays div{font-size:11px}.daynum{font-size:11px}.calendar{overflow-x:auto}.calendar-inner{min-width:580px}.mobileadd{display:block;position:fixed;right:18px;bottom:18px;border:0;background:var(--blue);color:white;width:52px;height:52px;border-radius:50%;font-size:26px;box-shadow:0 5px 20px #3977e855}}
</style></head>
<body><div class="app">
<aside><div class="brand"><span class="logo">▦</span> StudyLog</div><div class="nav"><button class="active" data-page="calendar"><span class="ico">▦</span>日历</button><button data-page="todo"><span class="ico">☑</span>待办作业</button><button data-page="today"><span class="ico">◉</span>今天</button><button data-page="completed"><span class="ico">✓</span>已完成</button></div><div class="sidehead">科目 <button class="addsubject" id="addSubject">＋</button></div><div id="subjects"></div><div style="position:absolute;bottom:24px;color:var(--muted);font-size:12px;padding-left:8px">⚙　设置与数据</div></aside>
<main class="main"><div class="top"><div class="monthnav"><button class="plain" id="prev">‹</button><h1 id="monthTitle">October 2026</h1><button class="plain" id="next">›</button><button class="mutebtn" id="todayBtn">今天</button></div><div class="controls"><input class="search" id="search" placeholder="⌕ 搜索作业…"><div class="viewtoggle"><button class="active" data-view="month">月</button><button data-view="week">周</button><button data-view="day">日</button></div><button class="mutebtn" id="addTask">＋ 添加作业</button></div></div><div class="calendar"><div class="calendar-inner"><div class="weekdays"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div></div><div class="days" id="days"></div></div></div><div style="font-size:11px;color:var(--muted);margin:12px 2px">提示：同一项作业会以连续色条横跨开始日期至截止日期；未完成的作业不会因逾期而消失。</div></main>
<aside class="right"><div class="righthead"><div><h2 id="rightDate">今天的作业</h2><span id="rightSubtitle">未完成任务持续保留</span></div><button class="plain" id="rightToday">›</button></div><div class="section"><div class="section-title">待完成 <span id="openCount">0</span></div><div id="todayTasks"></div></div><div class="section"><div class="section-title">即将截止 <span id="upCount">0</span></div><div class="upcoming" id="upcoming"></div></div><div class="detail" id="detail"><div style="color:var(--muted);font-size:12px">点击日历上的作业条查看详情。<br><br>你可以设置起止日期、科目颜色和子任务。</div></div><button class="primary" id="addTask2">＋ 新建作业</button></aside></div>
<button class="mobileadd" id="mobileAdd">＋</button>
<div class="modalback" id="taskModal"><div class="modal"><h2 id="modalTitle">添加作业</h2><form id="taskForm"><input type="hidden" id="taskId"><div class="field"><label for="taskName">作业名称</label><input id="taskName" required placeholder="例如：English A 文学分析论文"></div><div class="field"><label for="taskSubject">科目</label><select id="taskSubject"></select></div><div class="field"><label>作业颜色（莫兰迪色系）</label><input type="hidden" id="taskColor" value="#b9c9d8"><div class="palette" id="taskPalette"></div></div><div class="formgrid"><div class="field"><label for="startDate">开始日期</label><input type="date" id="startDate" required></div><div class="field"><label for="dueDate">截止日期（Due date）</label><input type="date" id="dueDate" required></div></div><div class="field"><label for="taskNotes">备注（选填）</label><input id="taskNotes" placeholder="要求、链接或补充信息"></div><div class="field"><label for="subtaskText">子任务（每行一项，选填）</label><textarea id="subtaskText" rows="3" style="border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:vertical" placeholder="阅读要求
完成提纲
检查并提交"></textarea></div><div class="modalactions"><button type="button" class="mutebtn" id="cancelModal">取消</button><button type="submit" class="primary" style="width:auto">保存作业</button></div></form></div></div>
<div class="modalback" id="subjectModal"><div class="modal"><h2>添加科目</h2><form id="subjectForm"><div class="field"><label>科目名称</label><input id="subjectName" required placeholder="例如：Physics"></div><div class="field"><label>默认颜色（莫兰迪色系）</label><input type="hidden" id="subjectColor" value="#b9c9d8"><div class="palette" id="subjectPalette"></div></div><div class="modalactions"><button type="button" class="mutebtn" id="cancelSubject">取消</button><button class="primary" style="width:auto">添加</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const today=new Date();today.setHours(0,0,0,0);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const fmt=(s,opts={month:'short',day:'numeric'})=>parse(s).toLocaleDateString('zh-CN',opts);const uid=()=>Math.random().toString(36).slice(2,10);
let subjects=JSON.parse(localStorage.getItem('studylog_subjects')||'null')||[{name:'English A',color:'#cfe1ff'},{name:'Math',color:'#ffdec7'},{name:'Biology',color:'#cceedd'},{name:'Chemistry',color:'#e2d4ff'},{name:'Psychology',color:'#f8cde1'},{name:'History',color:'#fff0ae'},{name:'CAS / Activities',color:'#c8eef0'}];let tasks=JSON.parse(localStorage.getItem('studylog_tasks')||'null')||[];let cursor=new Date(today.getFullYear(),today.getMonth(),1),selectedDate=iso(today),view='month',page='calendar',selectedTask=null,searchTerm='';function persist(){localStorage.setItem('studylog_subjects',JSON.stringify(subjects));localStorage.setItem('studylog_tasks',JSON.stringify(tasks))}function subj(name){return subjects.find(s=>s.name===name)||{name:name||'未分类',color:'#dfe4eb'}}function isDone(t){return !!t.done}function visibleTasks(){return tasks.filter(t=>(!searchTerm||t.name.toLowerCase().includes(searchTerm.toLowerCase())||(t.subject||'').toLowerCase().includes(searchTerm.toLowerCase()))&&(page!=='completed'||t.done)&&(page!=='todo'||!t.done)&&(page!=='today'||(!t.done&&t.start<=iso(today)&&t.due>=iso(today))))}
const PALETTE=[['雾霾蓝','#b9c9d8'],['灰蓝','#a8bac8'],['鼠尾草绿','#b7c8b2'],['橄榄灰绿','#c3c9ad'],['灰紫','#c5bdd2'],['薰衣草灰','#d0c8d8'],['豆沙粉','#d8b9bf'],['藕粉','#e0c8c8'],['陶土橘','#d9b6a2'],['杏仁奶茶','#e1cfb5'],['奶油黄','#e5d9a8'],['浅石墨','#c7c9cb'],['青灰','#a9c4c3'],['雾粉紫','#d6c3d0'],['海盐蓝','#c3d5dc'],['暖沙色','#d6c4ae']];
function drawPalette(id,selected){const el=$('#'+id);if(!el)return;el.innerHTML=PALETTE.map(([name,color])=>`<button type="button" class="colorpick ${color.toLowerCase()===String(selected).toLowerCase()?'selected':''}" data-palette-color="${color}" title="${name}" aria-label="${name}" style="background:${color}"></button>`).join('');el.querySelectorAll('[data-palette-color]').forEach(b=>b.onclick=()=>{const inputId=id==='taskPalette'?'taskColor':'subjectColor';$('#'+inputId).value=b.dataset.paletteColor;drawPalette(id,b.dataset.paletteColor)})}
function deleteTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;if(!confirm(`确定删除作业「${t.name}」吗？删除后无法恢复。`))return;tasks=tasks.filter(x=>x.id!==id);if(selectedTask===id)selectedTask=null;persist();render();$('#detail').innerHTML='<div style="color:var(--muted);font-size:12px">作业已删除。点击日历上的其他作业查看详情。</div>';toast('作业已删除')}
function renderSubjects(){ $('#subjects').innerHTML=subjects.map(s=>`<button class="subject" data-subject="${esc(s.name)}" style="--subject-color:${s.color};--subject-tint:${tint(s.color)}"><span class="dot" style="background:${s.color}"></span><span class="subject-name">${esc(s.name)}</span></button>`).join('');$('#taskSubject').innerHTML=subjects.map(s=>`<option>${esc(s.name)}</option>`).join('')}
function tint(hex){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);r=Math.round(r*.18+255*.82);g=Math.round(g*.18+255*.82);b=Math.round(b*.18+255*.82);return `rgb(${r},${g},${b})`}
function esc(x){return String(x??'').replace(/[&<>\
