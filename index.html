<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyLog · 作业日历</title>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--line:#e6e9ef;--text:#273142;--muted:#7d8797;--blue:#748eaf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{min-height:100vh;max-width:1600px;margin:auto;display:grid;grid-template-columns:210px minmax(0,1fr) 270px;background:white}
aside{padding:22px 15px;border-right:1px solid var(--line)}.brand{font-size:21px;font-weight:700;margin:4px 8px 28px}.nav{display:grid;gap:5px}.nav button,.subject{border:0;background:transparent;text-align:left;color:#647084;padding:10px 12px;border-radius:9px;cursor:pointer;width:100%}.nav button.active,.nav button:hover{background:#eef2f6;color:#526f91}.sidehead{display:flex;justify-content:space-between;align-items:center;margin:27px 8px 12px;font-weight:650}.subject{display:flex;gap:10px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}.addsubject,.plain{border:0;background:transparent;cursor:pointer;color:#637087;font-size:22px}.main{padding:24px 20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.monthnav,.controls{display:flex;align-items:center;gap:8px}.monthnav h1{font-size:24px;margin:0 7px;font-weight:650}.mutebtn,.primary,.dangerbtn{border:1px solid var(--line);background:white;color:#526174;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#e9eef4;border-color:#e9eef4;color:#506e91;font-weight:650}.search{border:1px solid var(--line);border-radius:9px;padding:10px;width:160px}.viewtoggle{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px}.viewtoggle button{border:0;background:white;padding:7px 10px;border-radius:6px;cursor:pointer;color:#647084}.viewtoggle button.active{background:#eef2f6;color:#526f91}
.calendar{border:1px solid var(--line);border-radius:12px;overflow:auto}.calendar-inner{min-width:560px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{text-align:center;color:var(--muted);font-size:12px;padding:12px 2px;border-bottom:1px solid var(--line)}.days{grid-auto-rows:minmax(110px,auto)}.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;padding:8px 6px;position:relative}.day:nth-child(7n){border-right:0}.daynum{font-size:12px;margin:0 0 8px 3px;color:#586477}.outside .daynum{color:#b9c0ca}.today{background:#f8fbff}.today .daynum{display:inline-grid;place-items:center;width:23px;height:23px;margin-top:-4px;background:#748eaf;color:white;border-radius:50%}.barstack{display:grid;gap:4px}.taskbar{height:24px;display:flex;align-items:center;gap:5px;padding:0 7px;border:0;font-size:11px;text-align:left;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0}.taskbar.start{border-radius:6px 0 0 6px;margin-right:-6px}.taskbar.middle{border-radius:0;margin-left:-6px;margin-right:-6px}.taskbar.end{border-radius:0 6px 6px 0;margin-left:-6px}.taskbar.single{border-radius:6px}.taskbar .barname{overflow:hidden;text-overflow:ellipsis}.taskbar.done{opacity:.5;text-decoration:line-through}.right{background:#fcfcfd}.right h2{font-size:16px}.righthead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.rightsection{padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}.taskrow,.upitem{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:12px}.taskrow input{margin-top:2px}.meta,.muted{font-size:11px;color:var(--muted)}.detail{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;margin:15px 0;font-size:12px}.detailactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.modalback{position:fixed;inset:0;background:#17203366;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:white;border-radius:15px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#647084}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9dfe8;border-radius:8px;font:inherit;background:white;color:#273142}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.palette{display:flex;gap:8px;flex-wrap:wrap}.colorpick{width:25px;height:25px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #cbd1da;cursor:pointer}.colorpick.selected{outline:2px solid #536174}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dangerbtn{color:#a35b57;background:#fff8f7;border-color:#ead3d1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273142;color:white;padding:10px 16px;border-radius:9px;display:none}.mobileadd{display:none}
@media(max-width:1100px){.app{grid-template-columns:170px minmax(0,1fr)}.right{display:none}}@media(max-width:700px){.app{display:block}.app>aside{display:none}.main{padding:16px 9px}.top{align-items:flex-start}.monthnav h1{font-size:20px}.controls{flex-wrap:wrap}.search{flex:1;min-width:120px}.days{grid-auto-rows:minmax(90px,auto)}.day{padding:6px 3px}.taskbar{font-size:9px;padding:0 4px;height:22px}.mobileadd{display:block;position:fixed;right:18px;bottom:18px;border:0;background:#748eaf;color:white;width:52px;height:52px;border-radius:50%;font-size:25px;box-shadow:0 5px 18px #3977a044}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand">▦ StudyLog</div><div class="nav">
<button class="active" data-page="calendar">▦　日历</button><button data-page="todo">☑　待办作业</button><button data-page="today">◉　今天</button><button data-page="completed">✓　已完成</button></div>
<div class="sidehead">科目 <button class="addsubject" id="addSubject">＋</button></div><div id="subjects"></div>
<div class="muted" style="margin:25px 8px">作业保存在当前浏览器</div></aside>
<main class="main"><div class="top"><div class="monthnav"><button class="plain" id="prev">‹</button><h1 id="monthTitle"></h1><button class="plain" id="next">›</button><button class="mutebtn" id="todayBtn">今天</button></div>
<div class="controls"><input class="search" id="search" placeholder="⌕ 搜索作业…"><div class="viewtoggle"><button class="active" data-view="month">月</button><button data-view="week">周</button><button data-view="day">日</button></div><button class="primary" id="addTask">＋ 添加作业</button></div></div>
<div class="calendar"><div class="calendar-inner"><div class="weekdays"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div></div><div class="days" id="days"></div></div></div>
<p class="muted">同一项作业会以连续色条横跨开始日期至截止日期；未完成的逾期作业仍会保留。</p></main>
<aside class="right"><div class="righthead"><div><h2 id="rightDate">今天的作业</h2><div class="muted">未完成任务持续保留</div></div><button class="plain" id="rightToday">›</button></div><div class="rightsection"><b>待完成 <span id="openCount">0</span></b><div id="todayTasks"></div></div><div class="rightsection"><b>即将截止 <span id="upCount">0</span></b><div id="upcoming"></div></div><div class="detail" id="detail">点击作业条查看详情。</div><button class="primary" id="addTask2">＋ 新建作业</button></aside>
</div><button class="mobileadd" id="mobileAdd">＋</button>
<div class="modalback" id="taskModal"><div class="modal"><h2 id="modalTitle">添加作业</h2><form id="taskForm"><input type="hidden" id="taskId">
<div class="field"><label>作业名称</label><input id="taskName" required placeholder="例如：English A 文学分析论文"></div><div class="field"><label>科目</label><select id="taskSubject"></select></div>
<div class="field"><label>作业颜色（莫兰迪色系）</label><input type="hidden" id="taskColor"><div class="palette" id="taskPalette"></div></div>
<div class="formgrid"><div class="field"><label>开始日期</label><input type="date" id="startDate" required></div><div class="field"><label>截止日期</label><input type="date" id="dueDate" required></div></div>
<div class="field"><label>备注（选填）</label><input id="taskNotes" placeholder="要求、链接或补充信息"></div><div class="field"><label>子任务（每行一项）</label><textarea id="subtaskText" rows="3" placeholder="阅读要求&#10;完成提纲&#10;检查并提交"></textarea></div>
<div class="modalactions"><button type="button" class="mutebtn" id="cancelModal">取消</button><button class="primary" type="submit">保存作业</button></div></form></div></div>
<div class="modalback" id="subjectModal"><div class="modal"><h2>添加科目</h2><form id="subjectForm"><div class="field"><label>科目名称</label><input id="subjectName" required placeholder="例如：Physics"></div><div class="field"><label>默认颜色</label><input type="hidden" id="subjectColor"><div class="palette" id="subjectPalette"></div></div><div class="modalactions"><button type="button" class="mutebtn" id="cancelSubject">取消</button><button class="primary">添加</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), today=new Date();today.setHours(0,0,0,0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10), tint=h=>{let n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return `rgb(${Math.round(r*.18+255*.82)},${Math.round(g*.18+255*.82)},${Math.round(b*.18+255*.82)})`};
const PALETTE=[['雾霾蓝','#b9c9d8'],['灰蓝','#a8bac8'],['鼠尾草绿','#b7c8b2'],['橄榄灰绿','#c3c9ad'],['灰紫','#c5bdd2'],['薰衣草灰','#d0c8d8'],['豆沙粉','#d8b9bf'],['藕粉','#e0c8c8'],['陶土橘','#d9b6a2'],['杏仁奶茶','#e1cfb5'],['奶油黄','#e5d9a8'],['浅石墨','#c7c9cb'],['青灰','#a9c4c3'],['雾粉紫','#d6c3d0'],['海盐蓝','#c3d5dc'],['暖沙色','#d6c4ae']];
const defaults=[{name:'English A',color:'#c5d5e5'},{name:'Math',color:'#e2cdbd'},{name:'Biology',color:'#bfd0bf'},{name:'Chemistry',color:'#cec5dc'},{name:'Psychology',color:'#d9bdc5'},{name:'History',color:'#ded6b2'},{name:'CAS / Activities',color:'#bcd2d0'}];
let subjects=load('studylog_subjects',defaults),tasks=load('studylog_tasks',[]),cursor=new Date(today.getFullYear(),today.getMonth(),1),selectedDate=iso(today),view='month',page='calendar',selectedTask=null,searchTerm='';
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function persist(){localStorage.setItem('studylog_subjects',JSON.stringify(subjects));localStorage.setItem('studylog_tasks',JSON.stringify(tasks))}
function subj(n){return subjects.find(s=>s.name===n)||{name:n||'未分类',color:'#cbd1d8'}}function color(t){return t.color||subj(t.subject).color}
function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function palette(id,inputId,selected){const el=$('#'+id);el.innerHTML=PALETTE.map(([n,c])=>`<button type="button" title="${n}" aria-label="${n}" class="colorpick ${c===selected?'selected':''}" data-c="${c}" style="background:${c}"></button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ $( '#'+inputId).value=b.dataset.c;palette(id,inputId,b.dataset.c)})}
function renderSubjects(){$('#subjects').innerHTML=subjects.map(s=>`<button class="subject" data-subject="${esc(s.name)}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('');$('#taskSubject').innerHTML=subjects.map(s=>`<option>${esc(s.name)}</option>`).join('')}
function filtered(){return tasks.filter(t=>(!searchTerm||(t.name+' '+t.subject).toLowerCase().includes(searchTerm.toLowerCase()))&&(page!=='completed'||t.done)&&(page!=='todo'||!t.done)&&(page!=='today'||(!t.done&&t.start<=iso(today)&&t.due>=iso(today))))}
function monday(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function renderCalendar(){const days=$('#days');days.innerHTML='';let start,end;if(view==='month'){start=monday(new Date(cursor.getFullYear(),cursor.getMonth(),1));end=addDays(monday(new Date(cursor.getFullYear(),cursor.getMonth()+1,0)),6);$('#monthTitle').textContent=cursor.toLocaleDateString('zh-CN',{year:'numeric',month:'long'})}else if(view==='week'){start=monday(parse(selectedDate));end=addDays(start,6);$('#monthTitle').textContent=`${iso(start)} — ${iso(end)}`}else{start=parse(selectedDate);end=start;$('#monthTitle').textContent=start.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}
let list=filtered(),d=new Date(start);while(d<=end){const key=iso(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==cursor.getMonth()&&view==='month'?' outside':'')+(key===iso(today)?' today':'');cell.innerHTML=`<div class="daynum">${d.getDate()}</div><div class="barstack"></div>`;const stack=cell.querySelector('.barstack');
list.filter(t=>t.start<=key&&t.due>=key).forEach(t=>{const st=t.start===key,en=t.due===key,one=st&&en,b=document.createElement('button');b.className='taskbar '+(one?'single':st?'start':en?'end':'middle')+(t.done?' done':'');b.style.background=tint(color(t));b.style.color='#394657';b.title=`${t.name} · ${t.start} 至 ${t.due}`;b.innerHTML=`<span class="barname">${st||one?'':'↳ '}${esc(t.name)}</span>`;b.onclick=()=>showDetail(t.id);stack.appendChild(b)});cell.onclick=e=>{if(e.target===cell||e.target.classList.contains('daynum')){selectedDate=key; if(view==='day')render();}};days.appendChild(cell);d=addDays(d,1)}
}
function renderSide(){const open=tasks.filter(t=>!t.done&&t.start<=iso(today)&&t.due>=iso(today));$('#rightDate').textContent=parse(selectedDate).toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});$('#openCount').textContent=open.length;$('#todayTasks').innerHTML=open.length?open.map(t=>`<label class="taskrow"><input type="checkbox" data-done="${t.id}"><span><span style="color:${color(t)}">●</span> ${esc(t.name)}<div class="meta">${esc(t.subject)} · 截止 ${t.due}</div></span></label>`).join(''):'<div class="muted" style="margin:12px 0">今天没有进行中的作业</div>';const upcoming=tasks.filter(t=>!t.done&&t.due>=iso(today)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);$('#upCount').textContent=upcoming.length;$('#upcoming').innerHTML=upcoming.map(t=>`<div class="upitem" data-open="${t.id}"><span style="color:${color(t)}">●</span><span>${esc(t.name)}<div class="meta">${esc(t.subject)}</div></span><span class="meta">${t.due}</span></div>`).join('');}
function render(){renderSubjects();renderCalendar();renderSide();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function showDetail(id){selectedTask=id;const t=tasks.find(x=>x.id===id);if(!t)return;const subs=t.subtasks||[];$('#detail').innerHTML=`<div style="font-weight:700;font-size:14px">${esc(t.name)}</div><div class="meta" style="margin-top:7px"><span style="color:${color(t)}">●</span> ${esc(t.subject)} · ${t.done?'已完成':'未完成'}</div><div class="meta" style="margin-top:7px">${t.start} → ${t.due}</div>${t.notes?`<p>${esc(t.notes)}</p>`:''}<div style="margin-top:12px">${subs.map((s,i)=>`<label style="display:flex;gap:7px;margin:8px 0"><input type="checkbox" data-sub="${i}" ${s.done?'checked':''}>${esc(s.text)}</label>`).join('')}</div><div class="detailactions"><button class="mutebtn" id="editTask">编辑</button><button class="mutebtn" id="toggleDone">${t.done?'标记未完成':'标记完成'}</button><button class="dangerbtn" id="deleteTask">删除</button></div>`;$('#editTask').onclick=()=>openTask(t);$('#toggleDone').onclick=()=>{t.done=!t.done;persist();render();showDetail(id)};$('#deleteTask').onclick=()=>{if(confirm('确定删除这项作业？')){tasks=tasks.filter(x=>x.id!==id);selectedTask=null;persist();render();$('#detail').textContent='作业已删除。'}};$('#detail').querySelectorAll('[data-sub]').forEach(c=>c.onchange=()=>{t.subtasks[+c.dataset.sub].done=c.checked;persist()})}
function openTask(t=null){$('#taskForm').reset();$('#taskId').value=t?.id||'';$('#modalTitle').textContent=t?'编辑作业':'添加作业';$('#taskName').value=t?.name||'';$('#taskSubject').value=t?.subject||subjects[0]?.name||'';$('#taskColor').value=t?.color||subj($('#taskSubject').value).color;$('#startDate').value=t?.start||selectedDate;$('#dueDate').value=t?.due||selectedDate;$('#taskNotes').value=t?.notes||'';$('#subtaskText').value=(t?.subtasks||[]).map(s=>s.text).join('\n');palette('taskPalette','taskColor',$('#taskColor').value);$('#taskModal').classList.add('show')}
function close(id){$('#'+id).classList.remove('show')}
$('#taskSubject').onchange=()=>{const c=subj($('#taskSubject').value).color;$('#taskColor').value=c;palette('taskPalette','taskColor',c)};
$('#taskForm').onsubmit=e=>{e.preventDefault();const id=$('#taskId').value,subject=$('#taskSubject').value,old=tasks.find(t=>t.id===id),start=$('#startDate').value,due=$('#dueDate').value;if(due<start){alert('截止日期不能早于开始日期。');return}const t={id:id||uid(),name:$('#taskName').value.trim(),subject,color:$('#taskColor').value,start,due,notes:$('#taskNotes').value.trim(),subtasks:$('#subtaskText').value.split('\n').map(s=>s.trim()).filter(Boolean).map((text,i)=>({text,done:old?.subtasks?.find(x=>x.text===text)?.done||false})),done:old?.done||false};if(old)tasks=tasks.map(x=>x.id===id?t:x);else tasks.push(t);selectedTask=t.id;persist();close('taskModal');render();showDetail(t.id);toast(old?'作业已更新':'作业已添加')};
$('#addTask').onclick=$('#addTask2').onclick=$('#mobileAdd').onclick=()=>openTask();$('#cancelModal').onclick=()=>close('taskModal');
$('#addSubject').onclick=()=>{$('#subjectForm').reset();$('#subjectColor').value=PALETTE[0][1];palette('subjectPalette','subjectColor',$('#subjectColor').value);$('#subjectModal').classList.add('show')};$('#cancelSubject').onclick=()=>close('subjectModal');
$('#subjectForm').onsubmit=e=>{e.preventDefault();const name=$('#subjectName').value.trim();if(subjects.some(s=>s.name.toLowerCase()===name.toLowerCase())){alert('这个科目已经存在。');return}subjects.push({name,color:$('#subjectColor').value});persist();close('subjectModal');render();toast('科目已添加')};
$('#prev').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else selectedDate=iso(addDays(parse(selectedDate),view==='week'?-7:-1));render()};$('#next').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else selectedDate=iso(addDays(parse(selectedDate),view==='week'?7:1));render()};$('#todayBtn').onclick=()=>{cursor=new Date(today.getFullYear(),today.getMonth(),1);selectedDate=iso(today);render()};$('#rightToday').onclick=$('#todayBtn').onclick;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#search').oninput=e=>{searchTerm=e.target.value;render()};
document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){const t=tasks.find(t=>t.id===e.target.dataset.done);if(t){t.done=e.target.checked;persist();render()}}});document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)showDetail(b.dataset.open);const s=e.target.closest('[data-subject]');if(s){const name=s.dataset.subject;page='todo';searchTerm=name;$('#search').value=name;render()}});
render();
</script></body></html>
